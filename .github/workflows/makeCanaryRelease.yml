name: Make Canary Release

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/edit2MakeNewCanary'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download px_files branch
      uses: actions/checkout@v4
      with:
        ref: px_files
        path: px_files
        
    - name: Prepare px_files for Canary Build
      run: |
        cp px_files/canary/module.prop MagiskModBase/module.prop
        cp px_files/canary/MagiskModuleUpdate_Full.json MagiskModuleUpdate_Full.json || true
        cp px_files/canary/MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Xposed.json || true
        cp px_files/latestCanary.json latestCanary.json || true
        cp px_files/CanaryChangelog.md CanaryChangelog.md || true

    - name: JDK 21 Setup
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Shell Scripts Permissions
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      run: .github/extractCanaryChanges.sh

    - name: Version Bump
      run: .github/prepareCanaryChangelog.sh ${{ github.run_id }}

    - name: Upload Xposed Artifact to Actions
      uses: actions/upload-artifact@v7.0.1
      with: 
        name: PixelXpert-Next.zip
        path: output

    - name: Canary Binary Release
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: 'canary_builds'
        name: 'Latest Canary'
        omitBodyDuringUpdate: true
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        artifacts: 'output/*.*'

    - name: Update px_files branch for Canary
      run: |
        cp MagiskModBase/module.prop px_files/canary/module.prop
        cp MagiskModuleUpdate_Full.json px_files/canary/MagiskModuleUpdate_Full.json || true
        cp MagiskModuleUpdate_Xposed.json px_files/canary/MagiskModuleUpdate_Xposed.json || true
        cp latestCanary.json px_files/latestCanary.json || true
        cp CanaryChangelog.md px_files/CanaryChangelog.md || true
        
        cd px_files
        VERSION=$(grep -i "VERSION_NAME" ../version.properties | cut -d '=' -f 2 | tr -d ' \r')
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "${VERSION}: ${{ github.sha }}: Update release files"
        git push origin px_files

    - name: Version Bump Commit
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'main'
        commit-message: 'Version update: Release [skip ci]'
        force-add: 'true'
        files: version.properties
        name: GitHub
        email: PixelXpert@siava.sh

    - name: Telegram Channel Post
      uses: appleboy/telegram-action@master
      if: env.TMessage != ''
      with:
        to: ${{ secrets.AOSPMODS_CHANNEL_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: ${{ env.TMessage }}

