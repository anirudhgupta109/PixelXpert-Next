name: Make Stable Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download px_files branch
      uses: actions/checkout@v4
      with:
        ref: px_files
        path: px_files

    - name: Prepare px_files for Stable Build
      run: |
        cp px_files/stable/module.prop MagiskModBase/module.prop
        cp px_files/stable/MagiskModuleUpdate_Full.json MagiskModuleUpdate_Full.json || true
        cp px_files/stable/MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Xposed.json || true
        cp px_files/latestStable.json latestStable.json || true
        cp px_files/StableChangelog.md MagiskChangelog.md || true

    - name: JDK 21 Setup
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Shell Scripts Permissions
      run: chmod +x .github/*.sh

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildStable -Pchannel=stable

    - name: Changelog and Release Notes
      run: |
        NEWVERNAME=${GITHUB_REF_NAME#v}
        
        sed -i 's|"zipUrl":.*|"zipUrl": "https://github.com/anirudhgupta109/PixelXpert-Next/releases/download/'$GITHUB_REF_NAME'/PixelXpert-Next.zip",|' MagiskModuleUpdate_Full.json || true
        sed -i 's|"zipUrl":.*|"zipUrl": "https://github.com/anirudhgupta109/PixelXpert-Next/releases/download/'$GITHUB_REF_NAME'/PixelXpert-Next.zip",|' MagiskModuleUpdate_Xposed.json || true
        sed -i 's|"zipUrl":.*|"zipUrl": "https://github.com/anirudhgupta109/PixelXpert-Next/releases/download/'$GITHUB_REF_NAME'/PixelXpert-Next.zip",|' latestStable.json || true
        sed -i 's|"zipUrl_Xposed":.*|"zipUrl_Xposed": "https://github.com/anirudhgupta109/PixelXpert-Next/releases/download/'$GITHUB_REF_NAME'/PixelXpert-Next.zip"|' latestStable.json || true
        
        echo "**$NEWVERNAME**  " > newChangeLog.md
        cat .github/workflowFiles/FutureChanageLog.md >> newChangeLog.md
        printf "\n\n" >> newChangeLog.md
        cat MagiskChangelog.md >> newChangeLog.md
        mv newChangeLog.md MagiskChangelog.md
        
        echo "**Changelog:**  " > releaseNotes.md
        cat .github/workflowFiles/FutureChanageLog.md >> releaseNotes.md
        cat .github/workflowFiles/ReleaseNotesTemplate.md >> releaseNotes.md
        
        echo "$NEWVERNAME released in stable channel" > telegram.msg
        echo "" >> telegram.msg
        echo "Changelog:" >> telegram.msg
        cat .github/workflowFiles/FutureChanageLog.md >> telegram.msg
        echo "" >> telegram.msg
        echo "URL: https://github.com/anirudhgupta109/PixelXpert-Next/releases/tag/$GITHUB_REF_NAME" >> telegram.msg
        
        echo 'TMessage<<EOF' >> $GITHUB_ENV
        cat telegram.msg >> $GITHUB_ENV
        echo >> $GITHUB_ENV
        echo 'EOF' >> $GITHUB_ENV

    - name: Upload Xposed Artifact to Actions
      uses: actions/upload-artifact@v7.0.1
      with: 
        name: PixelXpert-Next.zip
        path: output

    - name: Stable Binary Release
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: false
        draft: false
        artifacts: 'output/*.*'
        bodyFile: 'releaseNotes.md'

    - name: Update px_files branch for Stable
      run: |
        cp MagiskModBase/module.prop px_files/stable/module.prop
        cp MagiskModuleUpdate_Full.json px_files/stable/MagiskModuleUpdate_Full.json || true
        cp MagiskModuleUpdate_Xposed.json px_files/stable/MagiskModuleUpdate_Xposed.json || true
        cp latestStable.json px_files/latestStable.json || true
        cp MagiskChangelog.md px_files/StableChangelog.md || true
        
        cd px_files
        VERSION=${GITHUB_REF_NAME#v}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "stable-${VERSION}: Update release files"
        git push origin px_files

    - name: Telegram Channel Post
      uses: appleboy/telegram-action@master
      if: env.TMessage != ''
      with:
        to: ${{ secrets.AOSPMODS_CHANNEL_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: ${{ env.TMessage }}

