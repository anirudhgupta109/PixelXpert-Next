name: Make Test Release

on:
  push:
    branches:
      - 'test'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download px_files branch
      uses: actions/checkout@v4
      with:
        ref: px_files
        path: px_files
        
    - name: Prepare px_files for Canary Build
      run: |
        cp px_files/canary/module.prop MagiskModBase/module.prop
        cp px_files/canary/MagiskModuleUpdate_Full.json MagiskModuleUpdate_Full.json || true
        cp px_files/canary/MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Xposed.json || true
        cp px_files/latestCanary.json latestCanary.json || true
        cp px_files/CanaryChangelog.md CanaryChangelog.md || true

    - name: JDK 21 Setup
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Shell Scripts Permissions
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      run: .github/extractCanaryChanges.sh

    - name: Prepare Message
      run: .github/prepareCanaryChangelog.sh

    - name: Telegram Channel Post
      uses: appleboy/telegram-action@master
      if: env.TMessage != ''
      with:
        to: ${{ secrets.TEST_CHANNEL_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: ${{ env.TMessage }}

    - name: Telegram File Attachment
      if: env.TMessage != ''
      run: |
        curl -v "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMediaGroup?chat_id=${{ secrets.TEST_CHANNEL_ID }}&media=%5B%7B%22type%22%3A%22document%22%2C%20%22media%22%3A%22attach%3A%2F%2FXposed%22%7D%5D" -F Xposed="@output/PixelXpert-Next.zip"

    - name: Get Canary Version for SourceForge
      run: |
        VERSION=$(grep -i "VERSION_NAME" version.properties | cut -d '=' -f 2 | tr -d ' \r')
        echo "SF_VERSION=$VERSION" >> $GITHUB_ENV

    - name: SourceForge Upload
      continue-on-error: true
      env:
        SF_KEY: ${{ secrets.SF_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SF_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
        ssh anirudhgupta109@frs.sourceforge.net mkdir -p /home/frs/project/agbuilds/PixelXpert-Next/${{ env.SF_VERSION }}/ || true
        rsync -avP -e ssh output/* anirudhgupta109@frs.sourceforge.net:/home/frs/project/agbuilds/PixelXpert-Next/${{ env.SF_VERSION }}/