[versions]
agp = "9.1.0"
activity = "1.13.0"
appcompat = "1.7.1"
commonsText = "1.14.0"
concurrentFutures = "1.3.0"
constraintlayout = "2.2.1"
coreSplashscreen = "1.2.0"
coroutines = "1.9.0"
desugar_jdk_libs = "2.1.5"
gson = "2.13.2"
jetbrainsMarkdown = "0.7.16"
lottie = "6.7.1"
libsuVersion = "6.0.0"
materialComponents = "1.14.0"
objenesis = "3.4"
ntpClient = "0.0.1-alpha11"
persianDateTime = "4.2.1"
remotepreferences = "0.8"
workRuntime = "2.11.2"
kotlin = "2.2.21"
ksp = "2.3.6"

# --- Compose / Material 3 Expressive ---
# No Compose BOM: every androidx.compose artifact is pinned explicitly instead.
# material3 stays on the STABLE line (1.4.0) - M3 Expressive APIs in it are
# Kotlin-internal, so the expressive layer is implemented locally in
# app/src/main/.../theme/. Values match what compose-bom 2026.09.00 resolved.
compose = "1.12.1"
material3 = "1.4.0"
material3Adaptive = "1.4.0"
materialIcons = "1.7.8"
activityCompose = "1.13.0"
# Navigation3 on the stable line; 1.3.0-alpha01 is a prerelease.
navigation3 = "1.2.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
koin = "4.2.2"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workRuntime" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }
apache-commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# The dispatchers/withContext/CoroutineWorker calls the app makes itself
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Version must track the KSP Gradle plugin (libs.versions.ksp) so the
# processor's API surface matches the plugin that loads it.
symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
material-components = { module = "com.google.android.material:material", version.ref = "materialComponents" }
libsuCore = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsuVersion" }
libsuNIO = { module = "com.github.topjohnwu.libsu:nio", version.ref = "libsuVersion" }
libsuService = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsuVersion" }
# Parser only - the markdown is drawn with Compose (see ui/update/MarkdownText.kt),
# so no Compose-coupled artifact is pulled in.
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrainsMarkdown" }
objenesis = { group = "org.objenesis", name = "objenesis", version.ref = "objenesis" }
ntpClient = { group = "com.lyft.kronos", name = "kronos-android", version.ref = "ntpClient" }
persian-date-time = { module = "com.github.mfathi91:persian-date-time", version.ref = "persianDateTime" }
remotepreferences = { module = "com.crossbowffs.remotepreferences:remotepreferences", version.ref = "remotepreferences" }

# --- Compose / Material 3 Expressive ---
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3Adaptive" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# IllustrationPreference headers are Lottie animations.
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation3 serializes its NavBackstack into saved instance state, so every
# NavKey subtype needs a generated serializer.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }